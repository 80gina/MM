<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 810" width="1060" height="810" font-family="'Pretendard','Apple SD Gothic Neo','Noto Sans KR',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5A6580"/>
    </marker>
    <style>
      .band { fill: #FFFFFF; stroke: #D9D3C7; stroke-width: 1.5; rx: 10; }
      .bandlabel { font-size: 13px; font-weight: 700; fill: #6B7490; letter-spacing: .3px; }
      .box { rx: 8; stroke-width: 1.5; }
      .t { font-size: 13.5px; font-weight: 700; fill: #1F2A44; }
      .tn { font-size: 11.5px; font-weight: 700; fill: #1F2A44; }
      .s { font-size: 10.5px; fill: #4A5468; }
      .m { font-size: 10px; fill: #6B7490; font-style: italic; }
      .link { stroke: #5A6580; stroke-width: 1.7; fill: none; marker-end: url(#arrow); }
      .dashed { stroke-dasharray: 5 4; }
    </style>
  </defs>

  <rect width="1060" height="810" fill="#FBF8F2"/>
  <text x="30" y="38" font-size="21" font-weight="700" fill="#1F2A44">Mindily 시스템 아키텍처</text>
  <text x="30" y="58" class="s" font-size="12">감정 일기 → KcELECTRA 분석 → Agent 도구 호출 → 출처 접지 생성형 응답 → 동의 기반 선호 기억</text>

  <!-- 1. USER -->
  <rect class="band" x="30" y="76" width="1000" height="58"/>
  <text x="46" y="96" class="bandlabel">① 사용자</text>
  <rect class="box" x="400" y="86" width="260" height="38" fill="#EDE8FA" stroke="#B8AEE8"/>
  <text x="530" y="104" class="t" text-anchor="middle">모바일 / 데스크톱 브라우저</text>
  <text x="530" y="118" class="s" text-anchor="middle">설치 불필요 · HTTPS URL 접속</text>

  <!-- 2. FRONTEND -->
  <rect class="band" x="30" y="150" width="1000" height="92"/>
  <text x="46" y="170" class="bandlabel">② 프론트엔드 · dist/</text>
  <rect class="box" x="120" y="178" width="180" height="50" fill="#F7F2E8" stroke="#D9C9A8"/>
  <text x="210" y="198" class="t" text-anchor="middle">index.html</text>
  <text x="210" y="214" class="s" text-anchor="middle">화면 · 접근성 마크업</text>
  <rect class="box" x="320" y="178" width="180" height="50" fill="#F7F2E8" stroke="#D9C9A8"/>
  <text x="410" y="198" class="t" text-anchor="middle">app.js</text>
  <text x="410" y="214" class="s" text-anchor="middle">상태 · API 호출</text>
  <rect class="box" x="520" y="178" width="180" height="50" fill="#F7F2E8" stroke="#D9C9A8"/>
  <text x="610" y="198" class="t" text-anchor="middle">styles.css</text>
  <text x="610" y="214" class="s" text-anchor="middle">무드 미터 4색 팔레트</text>
  <rect class="box" x="730" y="178" width="210" height="50" fill="#E6EFE4" stroke="#A8C3A0"/>
  <text x="835" y="196" class="t" text-anchor="middle">localStorage</text>
  <text x="835" y="211" class="s" text-anchor="middle">일기 원문 · 확정 감정 (기기 보관)</text>
  <text x="835" y="224" class="m" text-anchor="middle">서버·LLM 어디에도 전송하지 않음</text>

  <!-- 3. API -->
  <rect class="band" x="30" y="258" width="1000" height="96"/>
  <text x="46" y="278" class="bandlabel">③ API 계층 · server.py (FastAPI + Uvicorn)</text>
  <rect class="box" x="60" y="288" width="176" height="52" fill="#E8EEF8" stroke="#9FB6D9"/>
  <text x="148" y="308" class="tn" text-anchor="middle">/api/emotions/analyze</text>
  <text x="148" y="324" class="s" text-anchor="middle">감정 분류 · 긴 글 청크</text>
  <rect class="box" x="248" y="288" width="176" height="52" fill="#E8EEF8" stroke="#9FB6D9"/>
  <text x="336" y="308" class="tn" text-anchor="middle">/api/agent/coach</text>
  <text x="336" y="324" class="s" text-anchor="middle">의도 판별 → 도구 호출</text>
  <rect class="box" x="436" y="288" width="176" height="52" fill="#E8EEF8" stroke="#9FB6D9"/>
  <text x="524" y="308" class="tn" text-anchor="middle">/api/rag/search · answer</text>
  <text x="524" y="324" class="s" text-anchor="middle">근거 검색 · 출처 접지 생성</text>
  <rect class="box" x="624" y="288" width="176" height="52" fill="#E8EEF8" stroke="#9FB6D9"/>
  <text x="712" y="308" class="tn" text-anchor="middle">/api/memory/*</text>
  <text x="712" y="324" class="s" text-anchor="middle">선호 저장 · 조회 · 삭제</text>
  <rect class="box" x="812" y="288" width="188" height="52" fill="#E8EEF8" stroke="#9FB6D9"/>
  <text x="906" y="308" class="tn" text-anchor="middle">/api/feedback · health · llm/status</text>
  <text x="906" y="324" class="s" text-anchor="middle">만족도 · 상태 공개</text>

  <!-- 4. AGENT -->
  <rect class="band" x="30" y="370" width="1000" height="122"/>
  <text x="46" y="390" class="bandlabel">④ AI Agent 계층 · coach_agent.py — 의도에 따라 필요한 도구만 순서대로 호출</text>
  <rect class="box" x="60" y="400" width="196" height="78" fill="#FBEAE4" stroke="#F2A08A"/>
  <text x="158" y="422" class="t" text-anchor="middle">의도 판별</text>
  <text x="158" y="440" class="s" text-anchor="middle">일기인가 / 대화인가</text>
  <text x="158" y="455" class="s" text-anchor="middle">휴식 요청인가</text>
  <text x="158" y="470" class="m" text-anchor="middle">추적에 도구명만 기록</text>

  <rect class="box" x="290" y="400" width="134" height="78" fill="#FBEAE4" stroke="#F2A08A"/>
  <text x="357" y="424" class="tn" text-anchor="middle">analyze_emotion</text>
  <text x="357" y="442" class="s" text-anchor="middle">6개 감정 점수</text>
  <text x="357" y="457" class="s" text-anchor="middle">→ 무드 좌표</text>

  <rect class="box" x="434" y="400" width="134" height="78" fill="#FBEAE4" stroke="#F2A08A"/>
  <text x="501" y="424" class="tn" text-anchor="middle">retrieve_grounding</text>
  <text x="501" y="442" class="s" text-anchor="middle">출처 카드 검색</text>
  <text x="501" y="457" class="s" text-anchor="middle">RAG</text>

  <rect class="box" x="578" y="400" width="134" height="78" fill="#F6DFD6" stroke="#E07A55" stroke-width="2.2"/>
  <text x="645" y="422" class="tn" text-anchor="middle">generate_</text>
  <text x="645" y="436" class="tn" text-anchor="middle">coach_message</text>
  <text x="645" y="452" class="s" text-anchor="middle">생성형 AI</text>
  <text x="645" y="467" class="m" text-anchor="middle">출처 안에서만</text>

  <rect class="box" x="722" y="400" width="134" height="78" fill="#FBEAE4" stroke="#F2A08A"/>
  <text x="789" y="424" class="tn" text-anchor="middle">recommend_healing</text>
  <text x="789" y="442" class="s" text-anchor="middle">호흡·필사·음악</text>
  <text x="789" y="457" class="s" text-anchor="middle">출처 링크 카드</text>

  <rect class="box" x="866" y="400" width="134" height="78" fill="#FBEAE4" stroke="#F2A08A"/>
  <text x="933" y="424" class="tn" text-anchor="middle">save_user_feedback</text>
  <text x="933" y="442" class="s" text-anchor="middle">만족도 1~5</text>
  <text x="933" y="457" class="s" text-anchor="middle">미동의 시 미저장</text>

  <!-- 5. DATA / MODEL -->
  <rect class="band" x="30" y="508" width="1000" height="112"/>
  <text x="46" y="528" class="bandlabel">⑤ 모델 · 지식 · 저장 계층</text>

  <rect class="box" x="60" y="538" width="180" height="70" fill="#EDE8FA" stroke="#B8AEE8"/>
  <text x="150" y="560" class="t" text-anchor="middle">KcELECTRA</text>
  <text x="150" y="576" class="s" text-anchor="middle">한국어 감정 분류</text>
  <text x="150" y="591" class="m" text-anchor="middle">리비전 2eaf89d8 고정</text>

  <rect class="box" x="250" y="538" width="180" height="70" fill="#F6DFD6" stroke="#E07A55" stroke-width="2.2"/>
  <text x="340" y="560" class="t" text-anchor="middle">생성형 AI (코디세이)</text>
  <text x="340" y="576" class="s" text-anchor="middle">llm.py · OpenAI 호환 · 안전 필터</text>
  <text x="340" y="591" class="m" text-anchor="middle">실패 시 규칙 기반 폴백</text>

  <rect class="box" x="440" y="538" width="180" height="70" fill="#E6EFE4" stroke="#A8C3A0"/>
  <text x="530" y="560" class="t" text-anchor="middle">RAG 지식베이스</text>
  <text x="530" y="576" class="s" text-anchor="middle">healing_knowledge.py</text>
  <text x="530" y="591" class="m" text-anchor="middle">출처·라이선스·갱신일</text>

  <rect class="box" x="630" y="538" width="180" height="70" fill="#E6EFE4" stroke="#A8C3A0"/>
  <text x="720" y="560" class="t" text-anchor="middle">Long-term Memory</text>
  <text x="720" y="576" class="s" text-anchor="middle">memory_db.py · SQLite</text>
  <text x="720" y="591" class="m" text-anchor="middle">동의 기반 · 30일 만료</text>

  <rect class="box" x="820" y="538" width="180" height="70" fill="#E6EFE4" stroke="#A8C3A0"/>
  <text x="910" y="560" class="t" text-anchor="middle">피드백 저장소</text>
  <text x="910" y="576" class="s" text-anchor="middle">feedback_db.py · SQLite</text>
  <text x="910" y="591" class="m" text-anchor="middle">익명 집계만 보관</text>

  <!-- 6. INFRA -->
  <rect class="band" x="30" y="636" width="1000" height="74"/>
  <text x="46" y="656" class="bandlabel">⑥ 배포 · 형상관리</text>
  <rect class="box" x="120" y="664" width="180" height="34" fill="#F7F2E8" stroke="#D9C9A8"/>
  <text x="210" y="686" class="t" text-anchor="middle">Dockerfile (모델 동봉)</text>
  <rect class="box" x="330" y="664" width="230" height="34" fill="#EDE8FA" stroke="#B8AEE8"/>
  <text x="445" y="686" class="t" text-anchor="middle">Hugging Face Spaces :7860</text>
  <rect class="box" x="590" y="664" width="170" height="34" fill="#F7F2E8" stroke="#D9C9A8"/>
  <text x="675" y="686" class="t" text-anchor="middle">GitHub main</text>
  <rect class="box" x="790" y="664" width="190" height="34" fill="#F7F2E8" stroke="#D9C9A8"/>
  <text x="885" y="686" class="t" text-anchor="middle">evidence/ 검증 기록</text>

  <!-- ARROWS -->
  <path class="link" d="M 530 124 L 530 176"/>
  <path class="link" d="M 410 230 L 336 286"/>
  <path class="link" d="M 410 230 L 148 286"/>
  <path class="link" d="M 410 230 L 712 286"/>
  <path class="link" d="M 410 230 L 900 286"/>

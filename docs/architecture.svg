  <text x="30" y="732" class="m">실선: 요청 흐름 · 점선: 근거 참조 및 배포 | 굵은 주황 테두리 = 생성형 AI 경로</text>
  <text x="30" y="750" class="m">개인정보 경계: 일기 원문은 ② 계층을 벗어나지 않는다. ⑤의 생성형 AI에는 감정 라벨·스트레스·출처 카드만 전달된다.</text>
  <text x="30" y="768" class="m">생성 실패·안전 필터 탈락 시 규칙 기반 문장으로 자동 폴백하며, 응답의 generation 필드로 어느 경로인지 항상 공개한다.</text>
</svg>

  <path class="link" d="M 568 439 L 576 439"/>
  <path class="link" d="M 712 439 L 720 439"/>
  <path class="link" d="M 357 480 L 170 536"/>
  <path class="link" d="M 501 480 L 520 536"/>
  <path class="link" d="M 645 480 L 350 536"/>
  <path class="link dashed" d="M 645 480 L 510 536"/>
